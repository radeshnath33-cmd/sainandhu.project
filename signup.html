{% extends "base.html" %}

{% block title %}Sign Up - My Fullstack App{% endblock %}

{% block content %}
<div class="bg-white shadow-xl rounded-2xl w-full max-w-md p-8 sm:p-10 border border-gray-100 relative overflow-hidden my-8">
    <!-- Decorative background elements -->
    <div class="absolute top-0 left-0 -ml-12 -mt-12 w-40 h-40 rounded-full bg-indigo-50 opacity-60 filter blur-xl"></div>
    <div class="absolute bottom-0 right-0 -mr-10 -mb-10 w-32 h-32 rounded-full bg-blue-50 opacity-60 filter blur-xl"></div>

    <div class="relative z-10">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Create an Account</h2>
            <p class="text-gray-500 mt-3 text-sm">Join us today! Please enter your details.</p>
        </div>

        <form action="{{ url_for('signup') }}" method="POST" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
                <input type="text" id="username" name="username" required 
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 ease-in-out"
                    placeholder="johndoe123">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email Address</label>
                <input type="email" id="email" name="email" required 
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 ease-in-out"
                    placeholder="you@example.com">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                <input type="password" id="password" name="password" required 
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 ease-in-out"
                    placeholder="••••••••">
            </div>
            
            <div class="pt-2">
                <button type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-md text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-200 transform hover:-translate-y-0.5">
                    Sign Up
                </button>
            </div>
        </form>

        <div class="mt-8 text-center text-sm pt-6 border-t border-gray-100">
            <p class="text-gray-600">Already have an account? 
                <a href="{{ url_for('login') }}" class="font-semibold text-indigo-600 hover:text-indigo-500 transition">Sign in here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
